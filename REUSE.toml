# SPDX-License-Identifier: Apache-2.0 OR MIT
version = 1

[[annotations]]
path = ["**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2023-2026 Sebastien Rousseau"
SPDX-License-Identifier = "Apache-2.0 OR MIT"

[[annotations]]
path = [
  "static/css/prism.css",
  "static/js/prism-theme-init.js",
  "static/js/prism.js"
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Sebastien Rousseau"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["static/pyodide/**", "static/js/cf-beacon.min.js"]
precedence = "override"
SPDX-FileCopyrightText = "See THIRD_PARTY_NOTICES.md and embedded package metadata"
SPDX-License-Identifier = "LicenseRef-ThirdParty"

# Open Font Licence faces, self-hosted because the CSP is `font-src 'self'`.
# Without this they inherit the Apache-2.0 OR MIT catch-all above, which is
# not the licence they are distributed under.
[[annotations]]
path = ["static/fonts/inter-var-*.woff2"]
precedence = "override"
SPDX-FileCopyrightText = "2016 The Inter Project Authors (https://github.com/rsms/inter)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["static/fonts/jetbrains-mono-var-*.woff2"]
precedence = "override"
SPDX-FileCopyrightText = "2020 The JetBrains Mono Project Authors (https://github.com/JetBrains/JetBrainsMono)"
SPDX-License-Identifier = "OFL-1.1"

# Photographs: Unsplash License, one file per photographer and photo ID
# (scripts/import_photos.py records the source of each).
[[annotations]]
path = ["static/img/photos/*.webp", "static/img/photos/*.avif", "static/img/photos/band/unsplash/*.webp", "static/img/photos/band/unsplash/*.avif"]
precedence = "override"
SPDX-FileCopyrightText = "The photographers named in THIRD_PARTY_NOTICES.md, via Unsplash"
SPDX-License-Identifier = "LicenseRef-Unsplash"

[[annotations]]
path = ["static/img/photos/band/pexels/*.webp", "static/img/photos/band/pexels/*.avif"]
precedence = "override"
SPDX-FileCopyrightText = "The photographers named in THIRD_PARTY_NOTICES.md, via Pexels"
SPDX-License-Identifier = "LicenseRef-Pexels"
