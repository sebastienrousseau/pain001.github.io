name: Website bug
description: Report a reproducible documentation, accessibility, or browser-tool defect.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include real payment, account, or personal data."
  - type: input
    id: url
    attributes:
      label: Affected URL
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Include the browser, viewport, steps, and exact output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Data safety
      options:
        - label: I removed all real payment, account, and personal data.
          required: true
