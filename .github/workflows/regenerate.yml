name: Regenerate for a pain001 release

# Fired by the library's publish job (repository_dispatch, event
# `suite-release`) or by hand. Installs the released version, regenerates
# every page and file derived from the library (corpus pages, scenario
# pages, demo samples, twin schemas, version stamps), rebuilds the site,
# runs the same gates as CI, and opens a pull request. Nothing deploys
# without a human merging that pull request.

on:
  repository_dispatch:
    types: [suite-release]
  workflow_dispatch:
    inputs:
      version:
        description: "pain001 version on PyPI, e.g. 0.0.71"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION: ${{ github.event.inputs.version || github.event.client_payload.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out the library at the release tag
        uses: actions/checkout@v4
        with:
          repository: sebastienrousseau/pain001
          ref: v${{ env.VERSION }}
          path: .pain001

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the released library
        run: |
          python -m pip install --upgrade pip
          for i in 1 2 3 4 5 6; do pip install "pain001==${VERSION}" pyyaml && break; echo "PyPI not serving ${VERSION} yet, retry $i"; sleep 60; done
          python -c "import pain001, sys; assert pain001.__version__ == '${VERSION}', pain001.__version__"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache ssg binary
        id: cache-ssg
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/ssg
          key: ssg-0.0.47-${{ runner.os }}

      - name: Install ssg 0.0.47
        if: steps.cache-ssg.outputs.cache-hit != 'true'
        run: cargo install ssg --version 0.0.47 --locked

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Regenerate from the library
        run: |
          python3 scripts/generate_try_samples.py
          python3 scripts/generate_corpus_page.py "$PWD/.pain001"
          python3 scripts/stamp_version.py "${VERSION}"

      - name: Build site
        run: ./build.sh

      - name: Gates
        run: |
          ssg audit -f ssg.toml -o docs --severity warn --fail-on warn
          node --test tests/*.test.mjs
          python3 scripts/validate_pages_i18n.py && python3 scripts/validate_runtime_i18n.py && python3 scripts/validate_try_i18n.py
          python3 scripts/validate_i18n_keys_live.py
          python3 scripts/validate_content_integrity.py
          python3 scripts/validate_links.py docs
          python3 scripts/validate_versions.py --current "${VERSION}"

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          git config user.name "pain001 release bot"
          git config user.email "contact@pain001.com"
          branch="release/pain001-${VERSION}"
          git checkout -B "$branch"
          rm -rf .pain001
          git add -A
          git commit -s -m "chore(release): regenerate for pain001 ${VERSION}" -m "Corpus pages, scenario pages, demo samples, twin schemas and version stamps regenerated from the released library; site rebuilt; gates run in this workflow."
          git push -f origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore(release): regenerate for pain001 ${VERSION}" \
            --body "Generated by the regenerate workflow for pain001 ${VERSION}: corpus pages, scenario pages, demo samples, twin schemas and version stamps from the released library, site rebuilt, all gates run in the workflow. The vendored demo wheel is not swapped automatically; update static/pyodide/ and its manifest when the runtime set changes." \
            || gh pr edit "$branch" --title "chore(release): regenerate for pain001 ${VERSION}"
