name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and attest without publishing a release"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  SSG_VERSION: 0.0.63

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache the demo runtime (fetched and hash-verified by build.sh)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pain001-runtime
          key: pain001-runtime-${{ hashFiles('static/pyodide/pain001-runtime.json') }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-ssg
        with:
          path: ~/.cargo/bin/ssg
          key: ssg-${{ env.SSG_VERSION }}-${{ runner.os }}

      - if: steps.cache-ssg.outputs.cache-hit != 'true'
        run: cargo install ssg --locked --version "$SSG_VERSION"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Verify signed tag and version
        if: github.ref_type == 'tag'
        run: |
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile "$GITHUB_WORKSPACE/.github/allowed_signers"
          git verify-tag "$GITHUB_REF_NAME"
          ./scripts/verify_release_version.sh
          # The Highlights are the one hand-written part of the release page;
          # fail before building if they are missing or out of format.
          test -f "docs/releases/${GITHUB_REF_NAME}.md"
          python3 scripts/release_notes.py --check

      # Reproducible build: every timestamp the build writes (archive
      # entries, the SBOM's metadata.timestamp) is the tagged commit's time,
      # and nothing is fetched from the live site. See the check below.
      - name: Pin the build time to the commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build and test
        run: |
          ./build.sh
          npm ci
          npm run coverage
          ssg audit -f ssg.toml -o site --severity warn --fail-on warn
          python3 scripts/validate_content_integrity.py
          python3 scripts/validate_links.py site

      - name: Package website, SBOM, and checksums
        run: |
          mkdir -p dist
          version="$(tr -d '[:space:]' < VERSION)"
          # Exported because the SBOM attestation's sbom-path takes a literal path, not
          # a glob, so the attestation step has to name the file exactly.
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          # Sorted entries, owner 0, every mtime the commit time, gzip
          # header time 0: the archive is a function of the commit.
          python3 scripts/release_backfill.py --src . --tag "v${version}" --out dist --mtime "$SOURCE_DATE_EPOCH"

      - name: Prove the archive is reproducible
        run: |
          # Build the same commit again from a clean tree and require
          # byte-identical release files.
          rm -rf site Pain001
          ./build.sh > /dev/null
          python3 scripts/release_backfill.py --src . --tag "v${RELEASE_VERSION}" --out "$RUNNER_TEMP/rebuild" --mtime "$SOURCE_DATE_EPOCH"
          diff dist/SHA256SUMS "$RUNNER_TEMP/rebuild/SHA256SUMS"
          echo "reproducible: two clean builds gave identical release files"

      - name: Attest website provenance
        # actions/attest-build-provenance v4 is a wrapper over actions/attest;
        # with no sbom-path or predicate, actions/attest writes SLSA provenance.
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "dist/pain001-site-v*.tar.gz"

      # subject-path expands globs; sbom-path does not. v0.0.3 failed here with
      # "SBOM file not found" while the identical glob resolved for the subject
      # in this same step, so both paths are now spelled out in full.
      - name: Attest SBOM
        # actions/attest replaces the deprecated actions/attest-sbom with the
        # same inputs; giving it sbom-path is what selects the SBOM mode.
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "dist/pain001-site-v${{ env.RELEASE_VERSION }}.tar.gz"
          sbom-path: "dist/pain001-site-v${{ env.RELEASE_VERSION }}.cdx.json"

      - name: Upload dry-run artefacts
        if: github.ref_type != 'tag' || inputs.dry_run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pain001-site-release-candidate
          path: dist/

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        # Title and notes in the portfolio's release format: Highlights from
        # docs/releases/<tag>.md, What's Changed and New Contributors from
        # GitHub's generated notes, the checksums, then the Full Changelog.
        run: |
          notes="$RUNNER_TEMP/notes.md"
          python3 scripts/release_notes.py --tag "$GITHUB_REF_NAME" --sums dist/SHA256SUMS --out "$notes"
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "$(python3 scripts/release_notes.py --tag "$GITHUB_REF_NAME" --title)" \
            --notes-file "$notes"
