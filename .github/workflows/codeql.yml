# CodeQL over the demo's ES modules, the service worker, the Node test and
# audit scripts, and the Python generators and validators. A static site,
# but one that ships first-party JavaScript to every visitor.
name: 🔍 CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1" # weekly, Monday 04:00 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Per-language paths: the Python extractor treats every entry as a
        # directory, so the service worker file belongs to the JavaScript
        # config only. The vendored Pyodide runtime and the corpus data are
        # not first-party code.
        include:
          - language: javascript-typescript
            paths: |
                - static/js
                - static/sw.js
                - scripts
                - tests
          - language: python
            paths: |
                - scripts
                - tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality
          config: |
            paths:
            ${{ matrix.paths }}
            paths-ignore:
              - static/pyodide
              - site

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          category: "/language:${{ matrix.language }}"
