name: CI

# Every push and PR rebuilds the site and enforces the full quality bar:
#   1. ssg's 15 audit gates (WCAG, JSON-LD, CSP/SRI, links, metadata,
#      performance, feeds, AI discovery, ...) — failing on warnings.
#   2. WAVE's documented rules plus axe AAA on every built page, light and
#      dark, and axe in system, light and dark modes on 13 key pages.
# The site is built in-job and, on main, deployed to GitHub Pages from
# the same run as an artifact, so nothing reaches production that did not
# pass every gate, and the built tree is never committed.

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # The one ssg pin: the cache key and the install step both read it,
  # so a bump can never update one and leave the other behind.
  SSG_VERSION: 0.0.63

jobs:
  build-and-audit:
    runs-on: ubuntu-24.04
    # The gate set takes about 32 minutes: Lighthouse over five profiles
    # is 14 of them and the site-wide axe scan 11. The limit is headroom,
    # not a target; at 30 the last step was cancelled mid-scan.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache the demo runtime (fetched and hash-verified by build.sh)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pain001-runtime
          key: pain001-runtime-${{ hashFiles('static/pyodide/pain001-runtime.json') }}

      - name: Cache ssg binary
        id: cache-ssg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/ssg
          key: ssg-${{ env.SSG_VERSION }}-${{ runner.os }}

      - name: Install ssg
        if: steps.cache-ssg.outputs.cache-hit != 'true'
        run: cargo install ssg --locked --version "$SSG_VERSION"

      - name: Set up Node (build samples, tests, audits)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install Node toolchain from the lockfile
        run: npm ci

      - name: Build site
        run: ./build.sh

      - name: Audit gates (fail on warnings)
        run: ssg audit -f ssg.toml -o site --severity warn --fail-on warn

      # Every script the site ships (static/js, less the vendored beacon):
      # unit, property and jsdom tests, gated at 90% lines and 80% branches.
      - name: Unit tests and coverage gate (shipped JavaScript)
        run: npm run coverage

      - name: Browser engine runs the library (Node, vendored runtime)
        run: node tests/engine.integration.mjs

      - name: Translation table integrity (key/tag/placeholder parity)
        run: |
          python3 scripts/validate_try_i18n.py
          python3 scripts/validate_pages_i18n.py pages_i18n
          python3 scripts/validate_pages_i18n.py docs_i18n
          python3 scripts/validate_runtime_i18n.py

      # Parity above only compares locale tables to en.json. This checks
      # en.json against the built pages, so a key that has drifted out of
      # the markup fails instead of silently shipping English.
      - name: Translation keys still match the built pages
        run: python3 scripts/validate_i18n_keys_live.py

      # Escaping defects produce valid HTML that every other gate
      # passes, so they need their own structural check.
      - name: Content integrity (no eaten markup, no double encoding)
        run: python3 scripts/validate_content_integrity.py

      # Three defects that every other gate passes: a headline that is really
      # an SEO title, a typeface declared but never worn, and an emoji doing
      # the job of an icon. Each one shipped before it had a gate.
      - name: Headline sanity (ratchet)
        run: python3 scripts/validate_headings.py

      - name: Font declaration and budget
        run: python3 scripts/validate_fonts.py

      - name: No emoji in CSS content
        run: python3 scripts/validate_css_content.py

      # Computed from the token blocks, not sampled from rendered pages, so
      # a pair no audited page paints is still held to AAA.
      - name: Token contrast (AAA text, 3:1 non-text)
        run: python3 scripts/validate_contrast.py

      # The homepage proof band is only worth showing if every figure is
      # the count of something a reviewer can open.
      - name: Proof figures match their sources
        run: python3 scripts/validate_proof.py

      - name: security.txt is published and current (RFC 9116)
        run: python3 scripts/validate_security_txt.py

      - name: Link integrity (internal links, anchors, locale consistency)
        run: python3 scripts/validate_links.py site

      - name: Suite version currency (no page cites an older pain001)
        run: python3 scripts/validate_versions.py

      - name: Documentation snippets reference real API
        run: |
          python3 -m pip install --quiet --require-hashes -r requirements/snippets.txt
          python3 scripts/validate_snippets.py

      # Layout and print defects produce valid, accessible, well-linked
      # pages — every other gate passes while a table is cropped, a
      # title is 140px adrift, or every table prints as stacked cards.
      # Three such regressions were caught only by a human looking at a
      # screenshot. These assert the invariants instead.
      - name: Layout and print integrity (real Chrome)
        run: |
          # The audit toolchain is pinned by tools/a11y/package-lock.json;
          # the runner's own Chrome is used, so no browser is downloaded.
          mkdir -p .a11y-tools
          cp tools/a11y/package.json tools/a11y/package-lock.json .a11y-tools/
          PUPPETEER_SKIP_DOWNLOAD=1 npm ci --prefix .a11y-tools --no-audit --no-fund
          nohup node scripts/serve_audit.mjs site 8899 > "$RUNNER_TEMP/pain001-audit-server.log" 2>&1 &
          for _ in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8899/ > /dev/null; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:8899/ > /dev/null
          node scripts/layout_audit.cjs
          node scripts/print_audit.cjs
          node scripts/measure_audit.cjs --all

      - name: Lighthouse 100% (mobile, tablet, desktop, 4K, 8K)
        run: CHROME_PATH=/usr/bin/google-chrome node scripts/perf_budget.mjs http://127.0.0.1:8899

      - name: Accessibility in system, light, and dark modes (axe)
        run: |
          node scripts/a11y_modes.mjs

      # Every built page, not a sample: WAVE's documented error and alert
      # rules plus the full axe rule set (AAA contrast included), in light
      # and dark. The taxonomy pages shipped unstyled because no sampled
      # URL was one of them.
      - name: Every page, WAVE rules and axe (light and dark)
        run: node scripts/audit_site.mjs

      # The upload drops dot-paths unless told otherwise, which is why
      # /.well-known/security.txt 404'd in production. Include them, after
      # removing the generator's build-only dotfiles so they are not
      # published with it.
      - name: Prune build-only dotfiles
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          rm -rf site/.meta site/.ssg-plugin-cache.json
          find site -name .DS_Store -delete

      - name: Upload the built site as the Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          include-hidden-files: true

  repository-quality:
    name: Repository quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Node toolchain from the lockfile
        run: npm ci

      - name: Workflow lint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

      - name: Documentation lint
        run: |
          npx --yes markdownlint-cli2@0.23.2
          python -m pip install --quiet --require-hashes -r requirements/lint.txt
          codespell

      - name: Python coding standard (ruff, see ruff.toml)
        run: ruff check scripts tests

      - name: JavaScript coding standard (ESLint, see eslint.config.mjs)
        run: npm run lint

      - name: Every source file carries its own SPDX header
        run: python3 scripts/validate_spdx_headers.py

      - name: README conforms to the workspace template
        run: python3 scripts/validate_readme.py

      - name: Release Highlights are in the release-page format
        run: python3 scripts/release_notes.py --check

      - name: Regression tests for the build and release scripts (pytest)
        run: |
          python -m pip install --quiet --require-hashes -r requirements/test.txt
          python -m pytest tests/python -q -p no:cacheprovider

      - name: Dependency advisories (npm audit, documented exceptions only)
        run: python3 scripts/audit_deps.py

      - name: Release version consistency
        run: ./scripts/verify_release_version.sh

      - name: REUSE licence metadata
        run: |
          reuse lint

  node-matrix:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    # package.json declares engines >= 22, and the build job only ever proves
    # Node 22. This backs the published floor on both supported majors: the
    # class of defect it catches is module-resolution drift, where a change to
    # package.json alters how Node parses the vendored CommonJS runtime.
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install Node toolchain from the lockfile
        run: npm ci

      - name: Unit tests
        run: npm test

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-audit
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
