name: CI

# Every push and PR rebuilds the site and enforces the full quality bar:
#   1. ssg's 15 audit gates (WCAG, JSON-LD, CSP/SRI, links, metadata,
#      performance, feeds, AI discovery, ...) — failing on warnings.
#   2. pa11y-ci at WCAG2AAA across 12 representative pages.
# The deployed docs/ is regenerated in-job, so a source change that breaks
# a gate can never merge green.

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # The one ssg pin: the cache key and the install step both read it,
  # so a bump can never update one and leave the other behind.
  SSG_VERSION: 0.0.47

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache ssg binary
        id: cache-ssg
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/ssg
          key: ssg-${{ env.SSG_VERSION }}-${{ runner.os }}

      - name: Install ssg
        if: steps.cache-ssg.outputs.cache-hit != 'true'
        run: cargo install ssg --locked --version "$SSG_VERSION"

      - name: Set up Node (build samples, tests, pa11y)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Build site
        run: ./build.sh

      - name: Audit gates (fail on warnings)
        run: ssg audit -f ssg.toml -o docs --severity warn --fail-on warn

      - name: Unit tests (demo input handling)
        run: node --test tests/*.test.mjs

      - name: Browser engine runs the library (Node, vendored runtime)
        run: |
          npm i --no-save pyodide@0.27.2
          node tests/engine.integration.mjs

      - name: Translation table integrity (key/tag/placeholder parity)
        run: |
          python3 scripts/validate_try_i18n.py
          python3 scripts/validate_pages_i18n.py pages_i18n
          python3 scripts/validate_pages_i18n.py docs_i18n
          python3 scripts/validate_runtime_i18n.py

      # Parity above only compares locale tables to en.json. This checks
      # en.json against the built pages, so a key that has drifted out of
      # the markup fails instead of silently shipping English.
      - name: Translation keys still match the built pages
        run: python3 scripts/validate_i18n_keys_live.py

      # Escaping defects produce valid HTML that every other gate
      # passes, so they need their own structural check.
      - name: Content integrity (no eaten markup, no double encoding)
        run: python3 scripts/validate_content_integrity.py

      - name: Link integrity (internal links, anchors, locale consistency)
        run: python3 scripts/validate_links.py docs

      - name: Suite version currency (no page cites an older pain001)
        run: python3 scripts/validate_versions.py

      - name: Documentation snippets reference real API
        run: |
          python3 -m pip install --quiet pain001
          python3 scripts/validate_snippets.py

      # Layout and print defects produce valid, accessible, well-linked
      # pages — every other gate passes while a table is cropped, a
      # title is 140px adrift, or every table prints as stacked cards.
      # Three such regressions were caught only by a human looking at a
      # screenshot. These assert the invariants instead.
      - name: Layout and print integrity (real Chrome)
        run: |
          mkdir -p .a11y-tools
          cd .a11y-tools
          echo '{"name":"pain001-a11y-tools","private":true}' > package.json
          PUPPETEER_SKIP_DOWNLOAD=1 npm install --silent --no-audit --no-fund puppeteer-core@23
          cd ..
          (cd docs && python3 -m http.server 8899 &)
          sleep 2
          node scripts/layout_audit.cjs
          node scripts/print_audit.cjs

      - name: Performance budgets (Lighthouse, mobile)
        run: |
          (cd docs && python3 -m http.server 8898 &)
          sleep 2
          CHROME_PATH=/usr/bin/google-chrome node scripts/perf_budget.mjs http://127.0.0.1:8898

      - name: Accessibility scan (pa11y-ci, WCAG2AAA)
        run: |
          (cd docs && python3 -m http.server 8899 &)
          sleep 2
          npx -y pa11y-ci@4.1.1
