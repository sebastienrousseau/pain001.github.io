# Weekly Search Console scoreboard: the last 28 days against the previous
# 28, for the site, the queries its content targets, and the top pages and
# countries, written to the run's summary. Read-only. It needs the
# GSC_SERVICE_ACCOUNT_JSON secret (see DEVELOPMENT.md); without it the run
# reports "not configured" and succeeds.
name: SEO scoreboard

on:
  schedule:
    - cron: "41 7 * * 1" # Mondays, 07:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoreboard:
    name: Search Console, last 28 days
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the hash-pinned client
        run: python -m pip install --quiet --require-hashes -r requirements/seo.txt

      - name: Build the scoreboard
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: python scripts/seo_scoreboard.py
