<!DOCTYPE html>
<html lang="{{language}}" data-theme="light">
  <head>
    <meta charset="{{charset}}" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>{{title}}</title>
    {{primary}}
    {{opengraph}}
    {{twitter}}
    <link rel="canonical" href="{{url}}" />
    <link rel="icon" type="image/x-icon" href="{{cdn}}/pain001/v1/logos/pain001.svg" />
    <style>
      :root {
        --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --bg-page: #ffffff; --text-main: #0f172a; --text-muted: #475569; --border-color: #e2e8f0;
        --primary: #0284c7; --radius-md: 12px;
      }
      [data-theme="dark"] {
        --bg-page: #090d16; --text-main: #f8fafc; --text-muted: #cbd5e1; --border-color: #334155;
        --primary: #38bdf8;
      }
      body { font-family: var(--font-sans); background: var(--bg-page); color: var(--text-main); line-height: 1.6; margin: 0; }
      .container { max-width: 800px; margin: 0 auto; padding: 4rem 1.5rem; }
      h1 { font-size: 2.5rem; margin-bottom: 1rem; }
      .form-group { margin-bottom: 1.5rem; }
      label { display: block; font-weight: 600; margin-bottom: 0.5rem; }
      input, textarea { width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-page); color: var(--text-main); font-size: 1rem; }
      button { background: var(--primary); color: #fff; padding: 0.85rem 2rem; border: none; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; }
      nav a { color: var(--primary); text-decoration: none; font-weight: 600; }
    </style>
  </head>
  <body>
    <main id="main-content" role="main" class="container">
      <nav aria-label="Contact Navigation"><a href="/">&larr; Back to Pain001 Home</a></nav>
      <h1 style="margin-top: 2rem;">Contact Pain001 Security &amp; Enterprise Support</h1>
      <p style="color: var(--text-muted); margin-bottom: 2rem;">Have questions regarding enterprise deployments, security audits, or 2026 ISO 20022 compliance?</p>
      
      <form action="https://formspree.io/f/xknlqrqz" method="POST">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" required placeholder="Jane Doe" />
        </div>
        <div class="form-group">
          <label for="email">Work Email</label>
          <input type="email" id="email" name="email" required placeholder="jane@institution.com" />
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="6" required placeholder="Details regarding your deployment or inquiry..."></textarea>
        </div>
        <button type="submit">Send Inquiry</button>
      </form>
    </main>
  </body>
</html>
