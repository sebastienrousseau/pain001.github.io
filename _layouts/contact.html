{{#extends "base"}}
{{#block "main"}}

<section class="page-hero">
  <div class="container hero-copy">
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <ol><li><a href="/">Home</a></li><li aria-current="page">{{title}}</li></ol>
    </nav>
    <p class="eyebrow eyebrow-hero">{{eyebrow}}</p>
    <h1>{{title}}</h1>
    <p class="lead hero-lead">{{subtitle}}</p>
  </div>
</section>

<section class="section">
  <div class="container">
    <article class="narrow prose content-body">
      {{!content}}
    </article>
  </div>
</section>
{{/block}}
