{{#extends "base"}}
{{#block "main"}}
<section class="page-hero">
  <div class="container hero-copy">
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <ol><li><a href="/">Home</a></li><li aria-current="page">{{title}}</li></ol>
    </nav>
    <p class="eyebrow eyebrow-hero">{{eyebrow}}</p>
    <h1>{{title}}</h1>
    <p class="lead hero-lead">{{subtitle}}</p>
    <div class="article-meta">Last reviewed <time datetime="{{last_reviewed}}">{{last_reviewed}}</time></div>
    <button class="bookmark-button" id="bookmark-page" type="button" aria-pressed="false"><span>Save page</span></button>
  </div>
  <div class="hero-slope" aria-hidden="true"></div>
</section>

<section class="section">
  <div class="container">
    <article class="prose content-body">
      {{!content}}
    </article>
  </div>
</section>
{{/block}}
